<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REEF Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/causa.css">
  <link rel="stylesheet" href="css/nav.css">
</head>

<body>
  <canvas id="mar" aria-hidden="true"></canvas>
  <canvas id="sombras" aria-hidden="true"></canvas>
  <div class="velo" aria-hidden="true"></div>
  <canvas id="nieve" aria-hidden="true"></canvas>

  <a class="marca" href="index.html" aria-label="REEF, inicio">
    <img src="assets/reef-web-corner.png" alt="REEF Records">
  </a>

  <nav class="navegacion" id="navegacion" aria-label="Principal">
    <button class="nav-menu" id="nav-menu" type="button" aria-expanded="false" aria-controls="nav-lista">Menú</button>
    <ul class="nav-lista" id="nav-lista">
      <li><a href="#" data-ruta="/about">About</a></li>
      <li><a href="musica.html" data-ruta="/musica">Música</a></li>
      <li><a href="#causa" data-ruta="/causas">Causas</a></li>
      <li><a href="#" data-ruta="/merch">Merch</a></li>
      <li><a href="ciencia.html" data-ruta="/ciencia">Ciencia</a></li>
      <li><a href="#" data-ruta="/donaciones">Donaciones</a></li>

    </ul>
  </nav>

  <header class="heroe" id="inicio">
    <div class="bloque">
      <h1 class="titulo">
        <img class="logotipo" src="assets/reef-logo.png" alt="REEF Records">
      </h1>
    </div>
    <button class="accion" id="accion" type="button">Entra al arrecife</button>
  </header>

  <main>
    <!-- Zona de descenso: el mar se oscurece y aparece la nieve marina -->
    <div class="descenso" aria-hidden="true"></div>

    <!-- ═════════ SECCIÓN 2 · LA CAUSA ═════════ -->
    <section class="causa" id="causa" aria-labelledby="causa-t">
      <div class="causa-texto">
        <h2 id="causa-t" class="revelar" tabindex="-1">No somos un producto, somos una <em>causa</em> que se comunica
          con música</h2>
      </div>

      <p class="causa-lema revelar d1">Música electrónica, moda circular y ciencia por el océano</p>

      <!-- Corriente: los tres objetos flotan en diagonal, unidos por una línea punteada ondulada -->
      <nav class="corriente" id="corriente" aria-label="Secciones de REEF">
        <svg class="corriente-trazo" aria-hidden="true">
          <path class="hilo hilo-fino" />
          <path class="hilo" />
        </svg>

        <a class="objeto objeto-merch" href="#" data-ruta="/merch">
          <span class="objeto-entrada revelar d1">
            <span class="objeto-cuerpo">
              <span class="burbuja" aria-hidden="true"></span>
              <img src="assets/objetos/merch-camiseta.webp" alt="" width="1180" height="1331" decoding="async">
            </span>
            <span class="objeto-nombre"><small aria-hidden="true">01</small>Merch</span>
          </span>
        </a>

        <a class="objeto objeto-musica" href="musica.html" data-ruta="/musica">
          <span class="objeto-entrada revelar d2">
            <span class="objeto-cuerpo">
              <span class="burbuja" aria-hidden="true"></span>
              <img src="assets/objetos/musica-vinilo.webp" alt="" width="1253" height="1253" decoding="async">
            </span>
            <span class="objeto-nombre"><small aria-hidden="true">02</small>Música</span>
          </span>
        </a>

        <a class="objeto objeto-causas" href="#" data-ruta="/causas">
          <span class="objeto-entrada revelar d3">
            <span class="objeto-cuerpo">
              <span class="burbuja" aria-hidden="true"></span>
              <img src="assets/objetos/causas-mantarraya.webp" alt="" width="1253" height="1253" decoding="async">
            </span>
            <span class="objeto-nombre"><small aria-hidden="true">03</small>Causas</span>
          </span>
        </a>
      </nav>
    </section>
  </main>

  <script src="js/scroll.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/oceano.js"></script>
  <script src="js/mantas.js"></script>
  <script src="js/nieve.js"></script>
  <script src="js/corriente.js"></script>
</body>

</html>
